# Реле курса Т-Банка. Работает в облаке GitHub, Mac включать не нужно.
# Раз в день берёт публичный курс доллара (банк продаёт, категория переводов, как в приложении),
# сверяет с курсом ЦБ и кладёт в файл rate.json. Таблица Google читает этот файл.
# Проверка сертификата отключена только для этого одного запроса публичного курса (у Т-Банка
# российский корневой сертификат). Подмену ловит сверка с ЦБ: допуск 15%.
name: Курс Т-Банка
on:
  schedule:
    - cron: '20 7 * * *'   # 07:20 UTC = 12:20 по Астане
  workflow_dispatch:
permissions:
  contents: write
jobs:
  kurs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Взять курс
        run: |
          python3 - <<'EOF'
          import json, ssl, urllib.request, datetime
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          req = urllib.request.Request("https://api.tbank.ru/v1/currency_rates?from=USD&to=RUB",
                                       headers={"User-Agent": "Mozilla/5.0"})
          data = json.loads(urllib.request.urlopen(req, timeout=40, context=ctx).read())
          rates = {x["category"]: x for x in data["payload"]["rates"]}
          sell = float(rates["DebitCardsTransfers"]["sell"])
          cbr = float(json.loads(urllib.request.urlopen(
              "https://www.cbr-xml-daily.ru/daily_json.js", timeout=40).read())["Valute"]["USD"]["Value"])
          assert abs(sell - cbr) / cbr < 0.15, f"курс {sell} слишком далёк от курса ЦБ {cbr}"
          out = {"sell": sell, "cbr": cbr, "date": datetime.date.today().isoformat(),
                 "source": "api.tbank.ru, DebitCardsTransfers, sell"}
          json.dump(out, open("rate.json", "w"), ensure_ascii=False, indent=1)
          print(out)
          EOF
      - name: Сохранить
        run: |
          git config user.name "kurs-bot"
          git config user.email "kurs-bot@users.noreply.github.com"
          git add rate.json
          git commit -m "курс $(date -u +%F)" || exit 0
          git push
