          # –Э–µ –±–µ—А—С–Љ –Ј–Є–Љ–Њ–є (–љ–Њ—П–±—А—МвАУ–Љ–∞—А—В) вАФ –ї–µ—В–љ—П—П –Њ–і–µ–ґ–і–∞
          –Э–Х_–Ч–Ш–Ь–Ю–Щ = []  # –≤—Л–Ї–ї—О—З–µ–љ–Њ 08.11: –Ј–Є–Љ–Њ–є –Є –њ–Њ–ї–Њ, –Є —Д—Г—В–±–Њ–ї–Ї–Є –њ–Њ–Ї—Г–њ–∞—О—В; –ґ–і—С–Љ —А–µ—И–µ–љ–Є—П –њ–Њ —Б–µ–Ј–Њ–љ–љ–Њ—Б—В–Є

          # –Э–µ –±–µ—А—С–Љ –ї–µ—В–Њ–Љ (–Љ–∞–євАУ—Б–µ–љ—В—П–±—А—М) вАФ —В—С–њ–ї–∞—П –Њ–і–µ–ґ–і–∞
          –Э–Х_–Ы–Х–Ґ–Ю–Ь = []  # –≤—Л–Ї–ї—О—З–µ–љ–Њ 08.11: –ґ–і—С–Љ —А–µ—И–µ–љ–Є—П –њ–Њ —Б–µ–Ј–Њ–љ–љ–Њ—Б—В–Є

          # –°–њ–Њ—А—В –і–ї—П –Ј–∞–ї–∞, –Ї—А–Њ—Б—Б–Њ–≤–Ї–Є –Є –Њ–±—Г–≤—М вАФ –Ї—А—Г–≥–ї—Л–є –≥–Њ–і, –Є—Е –љ–µ —Д–Є–ї—М—В—А—Г–µ–Љ (–Њ—В–і–µ–ї—М–љ–Њ–≥–Њ —Б–њ–Є—Б–Ї–∞ –љ–µ—В)


          def —Б–µ–Ј–Њ–љ(d=None):
              m = (d or date.today()).month
              return "–Ј–Є–Љ–∞" if m in (11, 12, 1, 2, 3) else "–ї–µ—В–Њ" if m in (5, 6, 7, 8, 9) else "–Љ–µ–ґ—Б–µ–Ј–Њ–љ—М–µ"


          def –њ—А–Є—З–Є–љ–∞_–Њ—В–Ї–∞–Ј–∞(–љ–∞–Ј–≤–∞–љ–Є–µ, —В–Є–њ, d=None):
              """–Т–Њ–Ј–≤—А–∞—Й–∞–µ—В –њ—А–Є—З–Є–љ—Г, –њ–Њ—З–µ–Љ—Г —В–Њ–≤–∞—А –љ–µ –±–µ—А—С–Љ, –Є–ї–Є '' –µ—Б–ї–Є –±–µ—А—С–Љ."""
              text = f" {–љ–∞–Ј–≤–∞–љ–Є–µ} {—В–Є–њ} ".lower()
              s = —Б–µ–Ј–Њ–љ(d)
              for w in –Э–Ш–Ъ–Ю–У–Ф–Р:
                  if w in text:
                      return f"–љ–Є–Ї–Њ–≥–і–∞ ({w.strip()})"
              if s == "–Ј–Є–Љ–∞":
                  for w in –Э–Х_–Ч–Ш–Ь–Ю–Щ:
                      if w in text:
                          return f"–љ–µ –Ј–Є–Љ–Њ–є ({w.strip()})"
              if s == "–ї–µ—В–Њ":
                  for w in –Э–Х_–Ы–Х–Ґ–Ю–Ь:
                      if w in text:
                          return f"–љ–µ –ї–µ—В–Њ–Љ ({w.strip()})"
              return ""
          PYEOF_1
          cat > —А–∞–Ј–Љ–µ—А—Л_—Д–Є–ї—М—В—А.py <<'PYEOF_2'
          """–Я—А–∞–≤–Є–ї–∞ —А–∞–Ј–Љ–µ—А–Њ–≤ –і–ї—П —В–∞–±–ї–Є—Ж—Л –Є –≤–Є—В—А–Є–љ—Л (–њ—А–∞–≤—П—В—Б—П —А—Г–Ї–∞–Љ–Є –Є–ї–Є –≥–Њ–ї–Њ—Б–Њ–Љ —З–µ—А–µ–Ј Claude).

          –Я–Њ–Ї–∞–Ј—Л–≤–∞–µ–Љ —В–Њ–ї—М–Ї–Њ –Њ–±—Л—З–љ—Л–µ —А–∞–Ј–Љ–µ—А—Л. Tall –Є Short (–Њ–і–µ–ґ–і–∞ –і–ї—П –≤—Л—Б–Њ–Ї–Є—Е –Є –љ–Є–Ј–Ї–Є—Е) –љ–µ –±–µ—А—С–Љ,
          —И–Є—А–Њ–Ї—Г—О –Њ–±—Г–≤—М (Wide) –љ–µ –±–µ—А—С–Љ. –Т—Б—С —Н—В–Њ –Ш–ї—М—П —Б–Љ–Њ—В—А–Є—В –Њ—В–і–µ–ї—М–љ–Њ, –њ–Њ –Ј–∞–њ—А–Њ—Б—Г.
          –†–∞–Ј–Љ–µ—А—Л –≤–Њ–Њ–±—Й–µ —Б–Њ–±–Є—А–∞–µ–Љ –њ–Њ –Ј–∞–њ—А–Њ—Б—Г, –і–ї—П —В–Њ–њ-20вА¶30 –Њ–і–љ–Њ–≥–Њ —Б–∞–є—В–∞ (–љ–µ –і–ї—П –≤—Б–µ–≥–Њ –Ї–∞—В–∞–ї–Њ–≥–∞).
          """
