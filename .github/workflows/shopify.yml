              # evo: –Њ–і–µ–ґ–і–∞, —А—О–Ї–Ј–∞–Ї–Є (—А–µ—И–µ–љ–Є–µ –Ш–ї—М–Є 14.11). –Р–Ї—Б–µ—Б—Б—Г–∞—А—Л –Є –±–µ–≥–Њ–≤–Њ–µ –Ш–ї—М—П —В–Њ–ґ–µ —Е–Њ—З–µ—В, –љ–Њ —Н—В–Є —А–∞–Ј–і–µ–ї—Л evo
              # —Б—В—А–Њ–Є—В —Б—В–Њ—А–Њ–љ–љ–Є–є –њ–Њ–Є—Б–Ї (Constructor), –≤ products.json –Є—Е –љ–µ—В вАФ –љ—Г–ґ–µ–љ –Њ—В–і–µ–ї—М–љ—Л–є —Б–њ–Њ—Б–Њ–±. –Ы—Л–ґ–Є/–±–Њ—А–і—Л/–≤–µ–ї–Є–Ї–Є/–і–µ—В—Б–Ї–Њ–µ –љ–µ –±–µ—А—С–Љ
              "evo_men": ("evo (–Љ—Г–ґ—Б–Ї–∞—П –Њ–і–µ–ґ–і–∞)", "https://www.evo.com", "/collections/mens-clothing-sale"),
              "evo_women": ("evo (–ґ–µ–љ—Б–Ї–∞—П –Њ–і–µ–ґ–і–∞)", "https://www.evo.com", "/collections/womens-clothing-sale"),
              "evo_bags": ("evo (—А—О–Ї–Ј–∞–Ї–Є –Є —З–µ–Љ–Њ–і–∞–љ—Л)", "https://www.evo.com", "/collections/bags-backpacks-luggage-sale"),
              "uspa": ("U.S. Polo Assn", "https://uspoloassn.com", "/collections/clearance-all"),
          }

          # –І—В–Њ –љ–µ –±–µ—А—С–Љ —В–Њ–ї—М–Ї–Њ –љ–∞ –Њ—В–і–µ–ї—М–љ—Л—Е —Б–∞–є—В–∞—Е (—Б–ї–Њ–≤–∞ –≤ –љ–∞–Ј–≤–∞–љ–Є–Є –Є —В–Є–њ–µ —В–Њ–≤–∞—А–∞). –Ю–±—Й–Є–µ –њ—А–∞–≤–Є–ї–∞ вАФ –≤ –њ—А–∞–≤–Є–ї–∞_–Њ—В–±–Њ—А–∞.py
          # evo: —И–ї–µ–Љ—Л –Є –≥–Њ—А–љ–Њ–ї—Л–ґ–љ—Л–µ/—Б–љ–Њ—Г–±–Њ—А–і–Є—З–µ—Б–Ї–Є–µ –Љ–∞—Б–Ї–Є –љ–µ –±–µ—А—С–Љ; –Њ–±—Л—З–љ—Л–µ –Њ—З–Ї–Є –Є —Б–љ–Њ—Г–±–Њ—А–і–Є—З–µ—Б–Ї–Є–µ –Ї—Г—А—В–Ї–Є –±–µ—А—С–Љ (–Ш–ї—М—П, 14.11)
          –Э–Х_–С–†–Р–Ґ–ђ_–Э–Р_–°–Р–Щ–Ґ–Х = {k: ["helmet", "goggle", "replacement lens"] for k in
                               ("evo_men", "evo_women", "evo_bags")}

          COUNTRY = {"burker": "DE", "asphaltgold": "DE"}  # Burker –Є Asphaltgold (–У–µ—А–Љ–∞–љ–Є—П) –Њ—В–і–∞—О—В —В–Њ–ї—М–Ї–Њ –µ–≤—А–Њ, –і–∞–ґ–µ –њ—А–Є –Ј–∞–њ—А–Њ—Б–µ –°–®–Р (Asphaltgold вАФ 14.11)      # —Б—В—А–∞–љ–∞ –њ–Њ –Ї–ї—О—З—Г —Б–∞–є—В–∞; –њ–Њ —Г–Љ–Њ–ї—З–∞–љ–Є—О US (–і–Њ–ї–ї–∞—А—Л). –Ф–ї—П –љ–µ–Љ–µ—Ж–Ї–Є—Е –≤–µ—А—Б–Є–є: "key": "DE" (–µ–≤—А–Њ)
          –Ь–Р–Ъ–°_–Ґ–Ю–Т–Р–†–Ю–Т = 100  # –ї—Г—З—И–Є—Е –њ–Њ —Б–Ї–Є–і–Ї–µ —Б –Њ–і–љ–Њ–≥–Њ —Б–∞–є—В–∞ (—А–µ—И–µ–љ–Є–µ –Ш–ї—М–Є 12.11: 100, –њ–Њ—В–Њ–Љ—Г —З—В–Њ –Ї–∞–ґ–і—Л–є –і–µ–љ—М –±–µ—А—С–Љ –Њ–і–Є–љ –Љ–∞–≥–∞–Ј–Є–љ –Є –Є–Ј –љ–µ–≥–Њ —В–Њ–њ-10вА¶20 –і–ї—П —Б—В–Њ—А–Є—Б)
          –Ґ–Ю–Я_CSV = 50        # —Б–Ї–Њ–ї—М–Ї–Њ –ї—Г—З—И–Є—Е –њ–Њ —Б–Ї–Є–і–Ї–µ –Ї–ї–∞—Б—В—М –≤ –Љ–∞–ї–µ–љ—М–Ї–Є–є top_<–Ї–ї—О—З>.csv –і–ї—П —В–∞–±–ї–Є—Ж—Л
          PORTION = 50
          MAX_PAGES = 100     # –њ–Њ—В–Њ–ї–Њ–Ї: 5000 —В–Њ–≤–∞—А–Њ–≤ –љ–∞ —Б–∞–є—В –Ј–∞ –њ—А–Њ–≥–Њ–љ (–µ—Б–ї–Є —Г–њ—А—С–Љ—Б—П, –≤ —Б–≤–Њ–і–Ї–µ –±—Г–і–µ—В ¬Ђ–њ–Њ—В–Њ–ї–Њ–Ї¬ї)
          PAUSE = 4.0         # —Б–µ–Ї—Г–љ–і –Љ–µ–ґ–і—Г –Ј–∞–њ—А–Њ—Б–∞–Љ–Є (–Є–Ј –Њ–±–ї–∞–Ї–∞ –Љ–∞–≥–∞–Ј–Є–љ—Л —Б—В—А–Њ–ґ–µ: –Њ–±—Й–Є–є –∞–і—А–µ—Б —Г –Љ–љ–Њ–≥–Є—Е)
          RETRY_WAITS = (30, 60, 120)  # –њ—А–Є –Њ—В–Ї–∞–Ј–µ ¬Ђ—Б–ї–Є—И–Ї–Њ–Љ —З–∞—Б—В–Њ¬ї (429) –ґ–і—С–Љ –Є –њ—А–Њ–±—Г–µ–Љ —Б–љ–Њ–≤–∞, –њ–Њ—В–Њ–Љ —Б–і–∞—С–Љ—Б—П
          SIZE_NAMES = ("size", "gr√ґ√Яe", "groesse", "taille", "talla", "taglia", "maat")
          COLOR_NAMES = ("color", "colour", "farbe", "couleur")

          FETCH = """async ([path, n, per]) => {
            const x = await fetch(path + '/products.json?limit=' + per + '&page=' + n);
            const t = await x.text();
            return [x.status, (x.headers.get('content-type') || ''), t];
          }"""


          def opt_index(options, names):
              for i, o in enumerate(options):
                  if o["name"].strip().lower() in names:
                      return i
              return None


          def norm_size(s):
              """'07.0' -> '7', '08.5' -> '8.5' (–Љ–∞–≥–∞–Ј–Є–љ—Л –Є–љ–Њ–≥–і–∞ –і–Њ–њ–Є—Б—Л–≤–∞—О—В –љ–Њ–ї—М —Б–њ–µ—А–µ–і–Є –Є ¬Ђ.0¬ї); –Њ—Б—В–∞–ї—М–љ–Њ–µ –Ї–∞–Ї –µ—Б—В—М."""
              m = re.fullmatch(r"0*(\d+)(?:\.(\d+))?", s.strip())
              if not m:
                  return s.strip()
              whole, frac = m.groups()
              return whole if frac in (None, "", "0", "00") else f"{whole}.{frac}"


          def to_row(key, shop, base, p, currency):
              opts = p.get("options", [])
              si, ci = opt_index(opts, SIZE_NAMES), opt_index(opts, COLOR_NAMES)
              if si is None and len(opts) == 1 and opts[0]["name"].strip().lower() != "title":
                  si = 0  # –µ–і–Є–љ—Б—В–≤–µ–љ–љ–∞—П –Њ–њ—Ж–Є—П —З–∞—Й–µ –≤—Б–µ–≥–Њ —А–∞–Ј–Љ–µ—А
              sale_vars = []
              for v in p["variants"]:
                  try:
                      now, was = float(v["price"]), float(v["compare_at_price"] or 0)
                  except (TypeError, ValueError):
                      continue
                  if was > now > 0 and v.get("available"):
                      sale_vars.append((now, was, v))
              if not sale_vars:
                  return None
              # –¶–µ–љ–∞ –Ї–∞–Ї –љ–∞ —Б—В—А–∞–љ–Є—Ж–µ –Љ–∞–≥–∞–Ј–Є–љ–∞: –њ–µ—А–≤—Л–є –≤–∞—А–Є–∞–љ—В –≤ –љ–∞–ї–Є—З–Є–Є (—Г DKNY —Г –±–Њ–ї—М—И–Є—Е —А–∞–Ј–Љ–µ—А–Њ–≤ —Ж–µ–љ–∞ –і—А—Г–≥–∞—П, —Б–∞–Љ—Г—О –љ–Є–Ј–Ї—Г—О –±—А–∞—В—М –љ–µ–ї—М–Ј—П)
              now, was, v0 = sale_vars[0]
              label = lambda v, i: (v.get(f"option{i + 1}") or "").strip()
              sizes = []
              if si is not None:
                  seen = set()
                  for v in p["variants"]:
                      s = norm_size(label(v, si))
                      if s and s not in seen:
                          seen.add(s)
                          sizes.append([s, s, bool(v.get("available"))])
                  sizes = [s for s in sizes if —А–∞–Ј–Љ–µ—А—Л_—Д–Є–ї—М—В—А.–Њ–±—Л—З–љ—Л–µ([s[0]]) == [s[0]]]
              title = p["title"]
              tags_l = p.get("tags") if isinstance(p.get("tags"), list) else []
              promo, official = [], ""
              for tg in tags_l:
                  if tg.startswith("product-url_"):
                      official = tg[len("product-url_"):].split("?")[0]  # –∞–і—А–µ—Б —В–Њ–≤–∞—А–∞ –љ–∞ –Њ—Д–Є—Ж–Є–∞–ї—М–љ–Њ–Љ —Б–∞–є—В–µ (—Г Shop Simon)
                  m = re.match(r"promo_(.+?)_(\d\d?/\d\d?/\d{4})_(\d\d?/\d\d?/\d{4})", tg)
                  if m:
                      try:
                          d0 = datetime.strptime(m.group(2), "%m/%d/%Y").date(); d1 = datetime.strptime(m.group(3), "%m/%d/%Y").date()
                          if d0 <= date.today() <= d1:
                              promo.append(m.group(1).strip())  # —В–Њ–ї—М–Ї–Њ –і–µ–є—Б—В–≤—Г—О—Й–Є–µ —Б–µ–≥–Њ–і–љ—П –∞–Ї—Ж–Є–Є –Є–Ј —В–µ–≥–Њ–≤
                      except ValueError:
                          pass
              return {
                  "–њ—А–Њ–Љ–Њ": " ; ".join(promo), "—Б—Б—Л–ї–Ї–∞_–Њ—Д–Є—Ж–Є–∞–ї—М–љ–∞—П": official,
                  "–∞—А—В–Є–Ї—Г–ї": f"{key}-{p['id']}",
                  "–љ–∞–Ј–≤–∞–љ–Є–µ": title,
                  "—В–Є–њ": p.get("product_type", "") or "",
                  "–±—А–µ–љ–і": p.get("vendor", ""),
                  "—Ж–≤–µ—В": label(v0, ci) if ci is not None else "",
                  "—Ж–µ–љ–∞_—Б–µ–є—З–∞—Б": now,
                  "—Ж–µ–љ–∞_–±—Л–ї–∞": was,
                  "—Б–Ї–Є–і–Ї–∞_%": round((was - now) / was * 100),
                  "–≤–∞–ї—О—В–∞": currency,
                  "–Ї–∞—А—В–Є–љ–Ї–∞": (p.get("images") or [{}])[0].get("src", ""),
                  "—Б—Б—Л–ї–Ї–∞": f"{base}/products/{p['handle']}",
                  "—А–∞–Ј–Љ–µ—А—Л": sizes,
                  "—В–µ–≥–Є": ", ".join(p.get("tags", [])[:8]) if isinstance(p.get("tags"), list) else str(p.get("tags", ""))[:80],
                  "–Љ–∞–≥–∞–Ј–Є–љ": shop,
                  "–і–∞—В–∞_—Б–±–Њ—А–∞": date.today().isoformat(),
              }


          def write_top_csv(key, rows):
              """top_<–Ї–ї—О—З>.csv: –ї—Г—З—И–Є–µ –њ–Њ —Б–Ї–Є–і–Ї–µ; —В–∞–±–ї–Є—Ж–∞ Google –њ–Њ–і—В—П–≥–Є–≤–∞–µ—В –µ–≥–Њ —Д–Њ—А–Љ—Г–ї–Њ–є IMPORTDATA.
              –†–∞–Ј–Љ–µ—А—Л —Г–ґ–µ –≤ –љ–∞–ї–Є—З–Є–Є –љ–∞ –Љ–Њ–Љ–µ–љ—В —Б–±–Њ—А–∞ (Shopify –Њ—В–і–∞—С—В –Є—Е –≤–Љ–µ—Б—В–µ —Б —В–Њ–≤–∞—А–Њ–Љ), –≤—А–µ–Љ—П —Б–±–Њ—А–∞ –њ–Є—И–µ–Љ —А—П–і–Њ–Љ."""
              now = (datetime.now(timezone.utc) + timedelta(hours=5)).strftime("%d.%m.%Y %H:%M") + " (–Р—Б—В–∞–љ–∞)"
              cols = ["–і–∞—В–∞_—Б–±–Њ—А–∞", "–Љ–∞–≥–∞–Ј–Є–љ", "–∞—А—В–Є–Ї—Г–ї", "–љ–∞–Ј–≤–∞–љ–Є–µ", "—В–Є–њ", "—Ж–≤–µ—В", "—Ж–µ–љ–∞_—Б–µ–є—З–∞—Б", "—Ж–µ–љ–∞_–±—Л–ї–∞",
                      "–≤–∞–ї—О—В–∞", "—Б—Б—Л–ї–Ї–∞", "–Ї–∞—А—В–Є–љ–Ї–∞", "—А–∞–Ј–Љ–µ—А—Л_–≤_–љ–∞–ї–Є—З–Є–Є", "—А–∞–Ј–Љ–µ—А—Л_—Б–Њ–±—А–∞–љ—Л"]
              with (OUT / f"top_{key}.csv").open("w", newline="", encoding="utf-8") as f:
                  w = csv.writer(f)
                  w.writerow(cols)
                  for r in rows[:–Ґ–Ю–Я_CSV]:
                      sizes = " | ".join(s[0] for s in r["—А–∞–Ј–Љ–µ—А—Л"] if s[2])  # –љ–µ –Ј–∞–њ—П—В–∞—П: —В–∞–±–ї–Є—Ж–∞ —Б–Ї–ї–µ–Є–≤–∞–µ—В ¬Ђ10, 11¬ї –≤ —З–Є—Б–ї–Њ
                      w.writerow([r["–і–∞—В–∞_—Б–±–Њ—А–∞"], r["–Љ–∞–≥–∞–Ј–Є–љ"], r["–∞—А—В–Є–Ї—Г–ї"], r["–љ–∞–Ј–≤–∞–љ–Є–µ"], r["—В–Є–њ"], r["—Ж–≤–µ—В"],
                                  f'{r["—Ж–µ–љ–∞_—Б–µ–є—З–∞—Б"]:.2f}', f'{r["—Ж–µ–љ–∞_–±—Л–ї–∞"]:.2f}', r["–≤–∞–ї—О—В–∞"], r["—Б—Б—Л–ї–Ї–∞"], r["–Ї–∞—А—В–Є–љ–Ї–∞"], sizes, now])


          def collect(browser, key):
              shop, base, path = SHOPIFY[key]
              ctx = browser.new_context(locale="en-US", viewport={"width": 1366, "height": 900})
              host = re.sub(r"^https?://", "", base).split("/")[0]
              # –°–∞–є—В —Б–∞–Љ —А–µ—И–∞–µ—В –њ–Њ –∞–і—А–µ—Б—Г, –Ї–∞–Ї—Г—О —Б—В—А–∞–љ—Г –њ–Њ–Ї–∞–Ј–∞—В—М (—Г –љ–∞—Б —Н—В–Њ –Ъ–∞–Ј–∞—Е—Б—В–∞–љ, —В–µ–љ–≥–µ). –Я—А–Њ—Б–Є–Љ –°–®–Р.
              ctx.add_cookies([{"name": "localization", "value": COUNTRY.get(key, "US"), "domain": host, "path": "/"}])
              pg = ctx.new_page()
              stat = {"—Б–∞–є—В": shop, "–Ї–ї—О—З": key, "—Б—В—А–∞–љ–Є—Ж": 0, "—В–Њ–≤–∞—А–Њ–≤_–≤—Б–µ–≥–Њ": 0, "—Б–Њ_—Б–Ї–Є–і–Ї–Њ–є": 0, "–Њ—В—Б–µ—П–љ–Њ_–њ—А–∞–≤–Є–ї–∞–Љ–Є": 0}
              try:
                  resp = pg.goto(base + path + "?country=" + COUNTRY.get(key, "US"), wait_until="domcontentloaded", timeout=45000)
                  pg.wait_for_timeout(3000)
                  stat["–Њ—В–≤–µ—В_—Б—В—А–∞–љ–Є—Ж—Л"] = resp.status if resp else None
                  currency = pg.evaluate("window.Shopify && window.Shopify.currency ? window.Shopify.currency.active : null")
                  stat["–≤–∞–ї—О—В–∞"] = currency
                  want = {"US": "USD", "DE": "EUR"}[COUNTRY.get(key, "US")]
                  if currency != want:
                      stat["–Њ—И–Є–±–Ї–∞"] = f"—Б–∞–є—В –њ–Њ–Ї–∞–Ј—Л–≤–∞–µ—В {currency}, –∞ –љ—Г–ґ–љ–Њ {want}: —Н—В–Њ –љ–µ —В–∞ –≤–µ—А—Б–Є—П –Љ–∞–≥–∞–Ј–Є–љ–∞, –љ–Є—З–µ–≥–Њ –љ–µ –Ј–∞–њ–Є—Б–∞–љ–Њ"
                      return stat
                  rows = []
                  for n in range(1, MAX_PAGES + 1):
                      status, ctype, text = pg.evaluate(FETCH, [path, n, PORTION])
                      for wait in RETRY_WAITS:
                          if status == 200 and "json" in ctype:
                              break
                          print(f"  {shop}: —Б—В—А–∞–љ–Є—Ж–∞ {n}, –Њ—В–≤–µ—В {status}; –ґ–і—Г {wait} —Б –Є –њ—А–Њ–±—Г—О —Б–љ–Њ–≤–∞", flush=True)
                          time.sleep(wait)
                          status, ctype, text = pg.evaluate(FETCH, [path, n, PORTION])
                      if status != 200 or "json" not in ctype:
                          stat["–Њ—И–Є–±–Ї–∞"] = f"products.json –≤–µ—А–љ—Г–ї {status} ({ctype[:30]}) –љ–∞ —Б—В—А–∞–љ–Є—Ж–µ {n} –і–∞–ґ–µ –њ–Њ—Б–ї–µ –Њ–ґ–Є–і–∞–љ–Є—П"
                          break
                      products = json.loads(text).get("products", [])
                      if not products:
                          break
                      stat["—Б—В—А–∞–љ–Є—Ж"] = n
                      stat["—В–Њ–≤–∞—А–Њ–≤_–≤—Б–µ–≥–Њ"] += len(products)
                      for p in products:
                          row = to_row(key, shop, base, p, currency)
                          if not row:
                              continue
                          stat["—Б–Њ_—Б–Ї–Є–і–Ї–Њ–є"] += 1
                          why = –њ—А–∞–≤–Є–ї–∞_–Њ—В–±–Њ—А–∞.–њ—А–Є—З–Є–љ–∞_–Њ—В–Ї–∞–Ј–∞(row["–љ–∞–Ј–≤–∞–љ–Є–µ"], f"{row['—В–Є–њ']} {row['—В–µ–≥–Є']}")
                          text = f"{row['–љ–∞–Ј–≤–∞–љ–Є–µ']} {row['—В–Є–њ']}".lower()
                          why = why or next((w for w in –Э–Х_–С–†–Р–Ґ–ђ_–Э–Р_–°–Р–Щ–Ґ–Х.get(key, []) if w in text), "")
                          if why or —А–∞–Ј–Љ–µ—А—Л_—Д–Є–ї—М—В—А.—И–Є—А–Њ–Ї–∞—П(row["–љ–∞–Ј–≤–∞–љ–Є–µ"], row["—В–Є–њ"]):
                              stat["–Њ—В—Б–µ—П–љ–Њ_–њ—А–∞–≤–Є–ї–∞–Љ–Є"] += 1
                              continue
                          rows.append(row)
                      if len(products) < PORTION:
                          break
                      if n == MAX_PAGES:
                          stat["–њ–Њ—В–Њ–ї–Њ–Ї"] = f"–і–Њ—Б—В–Є–≥–љ—Г—В –њ—А–µ–і–µ–ї {MAX_PAGES * PORTION} —В–Њ–≤–∞—А–Њ–≤, –≤–Њ–Ј–Љ–Њ–ґ–љ–Њ, —Н—В–Њ –љ–µ –≤–µ—Б—М Sale"
                      time.sleep(PAUSE)
                  if "–Њ—И–Є–±–Ї–∞" in stat:
                      stat["–Є—В–Њ–≥–Њ_–≤_—Д–∞–є–ї–µ"] = 0
                      stat["–љ–µ_–Ј–∞–њ–Є—Б–∞–љ–Њ"] = f"—Б–±–Њ—А –љ–µ–њ–Њ–ї–љ—Л–є ({len(rows)} —В–Њ–≤–∞—А–Њ–≤), –≤—З–µ—А–∞—И–љ–Є–µ —Д–∞–є–ї—Л –≤ —А–µ–њ–Њ–Ј–Є—В–Њ—А–Є–Є –Њ—Б—В–∞–≤–ї–µ–љ—Л –Ї–∞–Ї –µ—Б—В—М"
                      return stat
                  rows.sort(key=lambda r: (-r["—Б–Ї–Є–і–Ї–∞_%"], r["—Ж–µ–љ–∞_—Б–µ–є—З–∞—Б"]))
                  stat["–±—Л–ї–Њ_–і–Њ_–ї–Є–Љ–Є—В–∞"] = len(rows)
                  rows = rows[:–Ь–Р–Ъ–°_–Ґ–Ю–Т–Р–†–Ю–Т]
                  OUT.mkdir(exist_ok=True)
