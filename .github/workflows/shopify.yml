          python salesforce.py || echo "ВНИМАНИЕ: часть сайтов Salesforce собралась не полностью, см. строки выше"
          cp данные/sale_*.json данные/top_*.csv "$GITHUB_WORKSPACE/" || true
      - name: Положить в репозиторий
        run: |
          git config user.name "kurs-bot"
          git config user.email "kurs-bot@users.noreply.github.com"
