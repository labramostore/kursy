          _–Ы–Ш–®–Э–Ш–Х_–†–Р–Ч–Ь–Х–†–Ђ = re.compile(r"\b(tall|short)\b", re.I)
          _–®–Ш–†–Ю–Ъ–Р–ѓ_–Ю–С–£–Т–ђ = re.compile(r"\bwide\b|extra[- ]wide", re.I)


          def —И–Є—А–Њ–Ї–∞—П(–љ–∞–Ј–≤–∞–љ–Є–µ, —В–Є–њ=""):
              """True, –µ—Б–ї–Є –Љ–Њ–і–µ–ї—М вАФ —И–Є—А–Њ–Ї–∞—П –Њ–±—Г–≤—М (–µ—С –≤ –≤–Є—В—А–Є–љ—Г –љ–µ –±–µ—А—С–Љ)."""
              return bool(_–®–Ш–†–Ю–Ъ–Р–ѓ_–Ю–С–£–Т–ђ.search(f"{–љ–∞–Ј–≤–∞–љ–Є–µ} {—В–Є–њ}"))


          def –Њ–±—Л—З–љ—Л–µ(—А–∞–Ј–Љ–µ—А—Л):
              """–Ш–Ј —Б–њ–Є—Б–Ї–∞ –Љ–µ—В–Њ–Ї —А–∞–Ј–Љ–µ—А–Њ–≤ ('M', 'XL Tall', '10.5') –Њ—Б—В–∞–≤–ї—П–µ—В —В–Њ–ї—М–Ї–Њ –Њ–±—Л—З–љ—Л–µ."""
              return [s for s in —А–∞–Ј–Љ–µ—А—Л if not _–Ы–Ш–®–Э–Ш–Х_–†–Р–Ч–Ь–Х–†–Ђ.search(s) and not _–®–Ш–†–Ю–Ъ–Р–ѓ_–Ю–С–£–Т–ђ.search(s)]
