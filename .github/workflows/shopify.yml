# Весь Sale магазинов на Shopify (WSS, Asphaltgold) раз в день. Облако GitHub, Mac включать не нужно.
# Собрано файлом собрать_github_shopify.py: внутри слово в слово универсальный.py и общие правила.
# Результат: sale_<сайт>.json (весь Sale) и top_<сайт>.csv (топ-50, его читает таблица Google).
name: Sale Shopify
on:
  schedule:
    - cron: '45 7 * * *'   # 07:45 UTC = 12:45 по Астане
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright
      - name: Собрать Sale
        run: |
          mkdir -p "$RUNNER_TEMP/w" && cd "$RUNNER_TEMP/w"
          cat > правила_отбора.py <<'PYEOF_1'
          """Правила отбора: что НЕ берём в витрину. Общие для всех сайтов, правятся руками (или голосом через Claude).

          Ищем слова в названии и типе товара (по-английски, как на сайтах), без учёта регистра.
          """
          from datetime import date

          # Никогда не берём, в любой сезон
          НИКОГДА = ["kids", "kid's", "baby", "toddler", "infant", "boys", "girls", "junior", "(gs)", "(ps)", "(td)",  # детское и подростковое
                     "slide", "sandal", "flip flop", "flip-flop", "sock", "underwear", "brief", "boxer",
                     "swim", "bikini", "bra ", "sports bra", "trunks"]

          # Не берём зимой (ноябрь–март) — летняя одежда
          НЕ_ЗИМОЙ = []  # выключено 08.11: зимой и поло, и футболки покупают; ждём решения по сезонности

          # Не берём летом (май–сентябрь) — тёплая одежда
          НЕ_ЛЕТОМ = []  # выключено 08.11: ждём решения по сезонности

          # Спорт для зала, кроссовки и обувь — круглый год, их не фильтруем (отдельного списка нет)


          def сезон(d=None):
              m = (d or date.today()).month
              return "зима" if m in (11, 12, 1, 2, 3) else "лето" if m in (5, 6, 7, 8, 9) else "межсезонье"


          def причина_отказа(название, тип, d=None):
              """Возвращает причину, почему товар не берём, или '' если берём."""
              text = f" {название} {тип} ".lower()
              s = сезон(d)
              for w in НИКОГДА:
                  if w in text:
                      return f"никогда ({w.strip()})"
              if s == "зима":
                  for w in НЕ_ЗИМОЙ:
                      if w in text:
                          return f"не зимой ({w.strip()})"
              if s == "лето":
                  for w in НЕ_ЛЕТОМ:
                      if w in text:
                          return f"не летом ({w.strip()})"
              return ""
          PYEOF_1
          cat > размеры_фильтр.py <<'PYEOF_2'
          """Правила размеров для таблицы и витрины (правятся руками или голосом через Claude).

          Показываем только обычные размеры. Tall и Short (одежда для высоких и низких) не берём,
          широкую обувь (Wide) не берём. Всё это Илья смотрит отдельно, по запросу.
          Размеры вообще собираем по запросу, для топ-20…30 одного сайта (не для всего каталога).
          """
          import re

          ТОП_РАЗМЕРЫ = 30  # для скольких первых товаров с сайта показывать размеры

          _ЛИШНИЕ_РАЗМЕРЫ = re.compile(r"\b(tall|short)\b", re.I)
          _ШИРОКАЯ_ОБУВЬ = re.compile(r"\bwide\b|extra[- ]wide", re.I)


          def широкая(название, тип=""):
              """True, если модель — широкая обувь (её в витрину не берём)."""
              return bool(_ШИРОКАЯ_ОБУВЬ.search(f"{название} {тип}"))


          def обычные(размеры):
              """Из списка меток размеров ('M', 'XL Tall', '10.5') оставляет только обычные."""
              return [s for s in размеры if not _ЛИШНИЕ_РАЗМЕРЫ.search(s) and not _ШИРОКАЯ_ОБУВЬ.search(s)]
          PYEOF_2
          cat > универсальный.py <<'PYEOF_3'
          """Универсальный сборщик скидок для магазинов на Shopify (WSS, Asphaltgold и сотни других).

          Без ИИ. Открывает страницу раздела Sale в настоящем Chrome и забирает список товаров, который
          магазин сам отдаёт своей странице (products.json): цены, старая цена, размеры и их наличие.
          Берём ТОЛЬКО товары, у которых цена сейчас ниже обычной (compare_at_price > price) и есть размер в наличии.
          Защиту сайтов не обходим; если сайт не отдал данные, так и пишем. Ходим редко: порции по 50 и паузы.

          Запуск:  venv/bin/python универсальный.py              (все сайты из списка)
                   venv/bin/python универсальный.py asphaltgold  (один сайт, по ключу)
          Результат: данные/sale_<ключ>.json  (и короткая сводка в консоли)
          """
          import csv
          import json
          import re
          import sys
          import time
          from datetime import date, datetime, timedelta, timezone
          from pathlib import Path

          from playwright.sync_api import sync_playwright

          import правила_отбора
          import размеры_фильтр

          DIR = Path(__file__).parent
          OUT = DIR / "данные"

          # ключ: (название, адрес сайта, путь раздела Sale)
          SHOPIFY = {
              "wss": ("WSS", "https://www.shopwss.com", "/collections/on-sale"),
              "asphaltgold": ("Asphaltgold", "https://www.asphaltgold.com", "/collections/sale"),
              "aldo": ("ALDO", "https://www.aldoshoes.com", "/collections/sale"),
              "shoebacca_men": ("Shoebacca (мужское)", "https://www.shoebacca.com", "/collections/mens-sale"),
              "shoebacca_women": ("Shoebacca (женское)", "https://www.shoebacca.com", "/collections/womens-sale"),
              "juicy": ("Juicy Couture", "https://juicycouture.com", "/collections/sale"),
              "dkny": ("DKNY", "https://www.donnakaran.com", "/collections/sale"),
              "alo": ("Alo Yoga", "https://www.aloyoga.com", "/collections/womens-sale-all"),
              "forever21_women": ("Forever 21 (женское)", "https://www.forever21.com", "/collections/womens-sale"),
              "forever21_men": ("Forever 21 (мужское)", "https://www.forever21.com", "/collections/mens-sale"),
              "justfab": ("Just Fab", "https://www.justfab.com", "/collections/sale-clearance-all"),
              "karl": ("Karl Lagerfeld", "https://www.karllagerfeldparis.com", "/collections/mens-sale"),
              "yvesrocher": ("Yves Rocher", "https://yvesrocherusa.com", "/collections/sale"),
              "abh": ("Anastasia Beverly Hills", "https://www.anastasiabeverlyhills.com", "/collections/sales-offers"),
              "mac": ("MAC", "https://www.maccosmetics.com", "/collections/sale"),
              "tarte": ("Tarte", "https://tartecosmetics.com", "/collections/sale"),
              "eos": ("EOS", "https://evolutionofsmooth.com", "/collections/sale"),
              "jwpei": ("JW PEI", "https://www.jwpei.com", "/collections/clearance"),
              "end": ("END. Clothing", "https://www.endclothing.com", "/en-us/collections/sale"),
              "stevemadden_women": ("Steve Madden (женское)", "https://www.stevemadden.com", "/collections/womens-clearance"),
              "stevemadden_men": ("Steve Madden (мужское)", "https://www.stevemadden.com", "/collections/mens-sale"),
              "stevemadden_bags": ("Steve Madden (сумки, аксессуары)", "https://www.stevemadden.com", "/collections/bags-accessories-sale"),
              "ashford": ("Ashford (часы)", "https://www.ashford.com", "/collections/clearance"),
              "champion": ("Champion", "https://www.champion.com", "/collections/all-sale"),
              "shoepalace": ("Shoe Palace", "https://www.shoepalace.com", "/collections/sale"),
              "reebok": ("Reebok", "https://www.reebok.com", "/collections/sale"),
              "shopsimon": ("Shop Simon (outlet)", "https://shop.simon.com", "/collections/curated-outlet"),
              "shopsimon_coach": ("Shop Simon (Coach Outlet)", "https://shop.simon.com", "/collections/store-coach-outlet"),
              "shopsimon_mk": ("Michael Kors Outlet (через Shop Simon)", "https://shop.simon.com", "/collections/store-michael-kors-outlet"),
              "simon_adidas": ("adidas (через Shop Simon)", "https://shop.simon.com", "/collections/store-adidas"),
              "simon_calvinklein": ("Calvin Klein (через Shop Simon)", "https://shop.simon.com", "/collections/store-calvin-klein"),
              "simon_footlocker": ("Foot Locker (через Shop Simon)", "https://shop.simon.com", "/collections/store-foot-locker"),
              "simon_guessfactory": ("Guess Factory (через Shop Simon)", "https://shop.simon.com", "/collections/store-guess-factory"),
              "simon_hugoboss": ("HUGO BOSS (через Shop Simon)", "https://shop.simon.com", "/collections/store-hugo-boss"),
              "simon_newbalance": ("New Balance (через Shop Simon)", "https://shop.simon.com", "/collections/store-new-balance"),
              "simon_marcjacobs": ("Marc Jacobs (через Shop Simon)", "https://shop.simon.com", "/collections/store-marc-jacobs"),
              "simon_drmartens": ("Dr. Martens (через Shop Simon)", "https://shop.simon.com", "/collections/store-dr-martens"),
              "simon_clarks": ("Clarks (через Shop Simon)", "https://shop.simon.com", "/collections/store-clarks-shoes"),
              "simon_hoka": ("HOKA (через Shop Simon)", "https://shop.simon.com", "/collections/store-hoka"),
              "simon_lululemon": ("Lululemon (через Shop Simon)", "https://shop.simon.com", "/collections/store-lululemon"),
              "simon_birkenstock": ("Birkenstock (через Shop Simon)", "https://shop.simon.com", "/collections/store-birkenstock"),
              "simon_crocs": ("Crocs (через Shop Simon)", "https://shop.simon.com", "/collections/store-crocs"),
              "simon_anthropologie": ("Anthropologie (через Shop Simon)", "https://shop.simon.com", "/collections/store-anthropologie"),
              "simon_fossil": ("Fossil (через Shop Simon)", "https://shop.simon.com", "/collections/store-fossil"),
              "simon_brooksbrothers": ("Brooks Brothers (через Shop Simon)", "https://shop.simon.com", "/collections/store-brooks-brothers"),
              # добавлено 14.11.2026
              "burker": ("Burker (часы)", "https://www.burkerwatches.com", "/collections/sale"),
              "laphont": ("Laphont", "https://laphont.com", "/en-us/collections/sale"),  # без /en-us цены не американские (сверено 14.11)
              # evo: одежда, рюкзаки (решение Ильи 14.11). Аксессуары и беговое Илья тоже хочет, но эти разделы evo
              # строит сторонний поиск (Constructor), в products.json их нет — нужен отдельный способ. Лыжи/борды/велики/детское не берём
              "evo_men": ("evo (мужская одежда)", "https://www.evo.com", "/collections/mens-clothing-sale"),
              "evo_women": ("evo (женская одежда)", "https://www.evo.com", "/collections/womens-clothing-sale"),
              "evo_bags": ("evo (рюкзаки и чемоданы)", "https://www.evo.com", "/collections/bags-backpacks-luggage-sale"),
              "uspa": ("U.S. Polo Assn", "https://uspoloassn.com", "/collections/clearance-all"),
          }

          # Что не берём только на отдельных сайтах (слова в названии и типе товара). Общие правила — в правила_отбора.py
          # evo: шлемы и горнолыжные/сноубордические маски не берём; обычные очки и сноубордические куртки берём (Илья, 14.11)
          НЕ_БРАТЬ_НА_САЙТЕ = {k: ["helmet", "goggle", "replacement lens"] for k in
                               ("evo_men", "evo_women", "evo_bags")}

          COUNTRY = {"burker": "DE", "asphaltgold": "DE"}  # Burker и Asphaltgold (Германия) отдают только евро, даже при запросе США (Asphaltgold — 14.11)      # страна по ключу сайта; по умолчанию US (доллары). Для немецких версий: "key": "DE" (евро)
          МАКС_ТОВАРОВ = 100  # лучших по скидке с одного сайта (решение Ильи 12.11: 100, потому что каждый день берём один магазин и из него топ-10…20 для сторис)
          ТОП_CSV = 50        # сколько лучших по скидке класть в маленький top_<ключ>.csv для таблицы
          PORTION = 50
          MAX_PAGES = 100     # потолок: 5000 товаров на сайт за прогон (если упрёмся, в сводке будет «потолок»)
          PAUSE = 4.0         # секунд между запросами (из облака магазины строже: общий адрес у многих)
          RETRY_WAITS = (30, 60, 120)  # при отказе «слишком часто» (429) ждём и пробуем снова, потом сдаёмся
          SIZE_NAMES = ("size", "größe", "groesse", "taille", "talla", "taglia", "maat")
          COLOR_NAMES = ("color", "colour", "farbe", "couleur")

          FETCH = """async ([path, n, per]) => {
            const x = await fetch(path + '/products.json?limit=' + per + '&page=' + n);
            const t = await x.text();
            return [x.status, (x.headers.get('content-type') || ''), t];
          }"""


          def opt_index(options, names):
              for i, o in enumerate(options):
                  if o["name"].strip().lower() in names:
                      return i
              return None


          def norm_size(s):
              """'07.0' -> '7', '08.5' -> '8.5' (магазины иногда дописывают ноль спереди и «.0»); остальное как есть."""
              m = re.fullmatch(r"0*(\d+)(?:\.(\d+))?", s.strip())
              if not m:
                  return s.strip()
              whole, frac = m.groups()
              return whole if frac in (None, "", "0", "00") else f"{whole}.{frac}"


          def to_row(key, shop, base, p, currency):
              opts = p.get("options", [])
              si, ci = opt_index(opts, SIZE_NAMES), opt_index(opts, COLOR_NAMES)
              if si is None and len(opts) == 1 and opts[0]["name"].strip().lower() != "title":
                  si = 0  # единственная опция чаще всего размер
              sale_vars = []
              for v in p["variants"]:
                  try:
                      now, was = float(v["price"]), float(v["compare_at_price"] or 0)
                  except (TypeError, ValueError):
                      continue
                  if was > now > 0 and v.get("available"):
                      sale_vars.append((now, was, v))
              if not sale_vars:
                  return None
              # Цена как на странице магазина: первый вариант в наличии (у DKNY у больших размеров цена другая, самую низкую брать нельзя)
              now, was, v0 = sale_vars[0]
              label = lambda v, i: (v.get(f"option{i + 1}") or "").strip()
              sizes = []
              if si is not None:
                  seen = set()
                  for v in p["variants"]:
                      s = norm_size(label(v, si))
                      if s and s not in seen:
                          seen.add(s)
                          sizes.append([s, s, bool(v.get("available"))])
                  sizes = [s for s in sizes if размеры_фильтр.обычные([s[0]]) == [s[0]]]
              title = p["title"]
              tags_l = p.get("tags") if isinstance(p.get("tags"), list) else []
              promo, official = [], ""
              for tg in tags_l:
                  if tg.startswith("product-url_"):
                      official = tg[len("product-url_"):].split("?")[0]  # адрес товара на официальном сайте (у Shop Simon)
                  m = re.match(r"promo_(.+?)_(\d\d?/\d\d?/\d{4})_(\d\d?/\d\d?/\d{4})", tg)
                  if m:
                      try:
                          d0 = datetime.strptime(m.group(2), "%m/%d/%Y").date(); d1 = datetime.strptime(m.group(3), "%m/%d/%Y").date()
                          if d0 <= date.today() <= d1:
                              promo.append(m.group(1).strip())  # только действующие сегодня акции из тегов
                      except ValueError:
                          pass
              return {
                  "промо": " ; ".join(promo), "ссылка_официальная": official,
                  "артикул": f"{key}-{p['id']}",
                  "название": title,
                  "тип": p.get("product_type", "") or "",
                  "бренд": p.get("vendor", ""),
                  "цвет": label(v0, ci) if ci is not None else "",
                  "цена_сейчас": now,
                  "цена_была": was,
                  "скидка_%": round((was - now) / was * 100),
                  "валюта": currency,
                  "картинка": (p.get("images") or [{}])[0].get("src", ""),
                  "ссылка": f"{base}/products/{p['handle']}",
                  "размеры": sizes,
                  "теги": ", ".join(p.get("tags", [])[:8]) if isinstance(p.get("tags"), list) else str(p.get("tags", ""))[:80],
                  "магазин": shop,
                  "дата_сбора": date.today().isoformat(),
              }


          def write_top_csv(key, rows):
              """top_<ключ>.csv: лучшие по скидке; таблица Google подтягивает его формулой IMPORTDATA.
              Размеры уже в наличии на момент сбора (Shopify отдаёт их вместе с товаром), время сбора пишем рядом."""
              now = (datetime.now(timezone.utc) + timedelta(hours=5)).strftime("%d.%m.%Y %H:%M") + " (Астана)"
              cols = ["дата_сбора", "магазин", "артикул", "название", "тип", "цвет", "цена_сейчас", "цена_была",
                      "валюта", "ссылка", "картинка", "размеры_в_наличии", "размеры_собраны"]
              with (OUT / f"top_{key}.csv").open("w", newline="", encoding="utf-8") as f:
                  w = csv.writer(f)
                  w.writerow(cols)
                  for r in rows[:ТОП_CSV]:
                      sizes = " | ".join(s[0] for s in r["размеры"] if s[2])  # не запятая: таблица склеивает «10, 11» в число
                      w.writerow([r["дата_сбора"], r["магазин"], r["артикул"], r["название"], r["тип"], r["цвет"],
                                  f'{r["цена_сейчас"]:.2f}', f'{r["цена_была"]:.2f}', r["валюта"], r["ссылка"], r["картинка"], sizes, now])


          def collect(browser, key):
              shop, base, path = SHOPIFY[key]
              ctx = browser.new_context(locale="en-US", viewport={"width": 1366, "height": 900})
              host = re.sub(r"^https?://", "", base).split("/")[0]
              # Сайт сам решает по адресу, какую страну показать (у нас это Казахстан, тенге). Просим США.
              ctx.add_cookies([{"name": "localization", "value": COUNTRY.get(key, "US"), "domain": host, "path": "/"}])
              pg = ctx.new_page()
              stat = {"сайт": shop, "ключ": key, "страниц": 0, "товаров_всего": 0, "со_скидкой": 0, "отсеяно_правилами": 0}
              try:
                  resp = pg.goto(base + path + "?country=" + COUNTRY.get(key, "US"), wait_until="domcontentloaded", timeout=45000)
                  pg.wait_for_timeout(3000)
                  stat["ответ_страницы"] = resp.status if resp else None
                  currency = pg.evaluate("window.Shopify && window.Shopify.currency ? window.Shopify.currency.active : null")
                  stat["валюта"] = currency
                  want = {"US": "USD", "DE": "EUR"}[COUNTRY.get(key, "US")]
                  if currency != want:
                      stat["ошибка"] = f"сайт показывает {currency}, а нужно {want}: это не та версия магазина, ничего не записано"
                      return stat
                  rows = []
                  for n in range(1, MAX_PAGES + 1):
                      status, ctype, text = pg.evaluate(FETCH, [path, n, PORTION])
                      for wait in RETRY_WAITS:
                          if status == 200 and "json" in ctype:
                              break
                          print(f"  {shop}: страница {n}, ответ {status}; жду {wait} с и пробую снова", flush=True)
                          time.sleep(wait)
                          status, ctype, text = pg.evaluate(FETCH, [path, n, PORTION])
                      if status != 200 or "json" not in ctype:
                          stat["ошибка"] = f"products.json вернул {status} ({ctype[:30]}) на странице {n} даже после ожидания"
                          break
                      products = json.loads(text).get("products", [])
                      if not products:
                          break
                      stat["страниц"] = n
                      stat["товаров_всего"] += len(products)
                      for p in products:
                          row = to_row(key, shop, base, p, currency)
                          if not row:
                              continue
                          stat["со_скидкой"] += 1
                          why = правила_отбора.причина_отказа(row["название"], f"{row['тип']} {row['теги']}")
                          text = f"{row['название']} {row['тип']}".lower()
                          why = why or next((w for w in НЕ_БРАТЬ_НА_САЙТЕ.get(key, []) if w in text), "")
                          if why or размеры_фильтр.широкая(row["название"], row["тип"]):
                              stat["отсеяно_правилами"] += 1
                              continue
                          rows.append(row)
                      if len(products) < PORTION:
                          break
                      if n == MAX_PAGES:
                          stat["потолок"] = f"достигнут предел {MAX_PAGES * PORTION} товаров, возможно, это не весь Sale"
                      time.sleep(PAUSE)
                  if "ошибка" in stat:
                      stat["итого_в_файле"] = 0
                      stat["не_записано"] = f"сбор неполный ({len(rows)} товаров), вчерашние файлы в репозитории оставлены как есть"
                      return stat
                  rows.sort(key=lambda r: (-r["скидка_%"], r["цена_сейчас"]))
                  stat["было_до_лимита"] = len(rows)
