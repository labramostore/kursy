          """Отчёт после облачного сбора: что собралось, сколько товаров, что упало и что не обновилось.

          Запускается в облаке GitHub последним шагом (см. собрать_github_shopify.py). Пишет report.md рядом.
          Читает данные/sale_*.json и данные/top_*.csv, а список сбоев берёт из файла провалы.txt
          (туда relay-скрипт пишет имя сборщика, если он упал).
          Запуск: python3 отчёт_сбора.py <папка_с_данными> <имя_отчёта.md>
          """
          import csv
          import json
          import sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          ASTANA = timezone(timedelta(hours=5))


          def count_sale(path):
              try:
                  d = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return None
              if isinstance(d, dict):
                  for k in ("rows", "items", "products"):
                      if isinstance(d.get(k), list):
                          return len(d[k])
                  return None
              return len(d) if isinstance(d, list) else None


          def count_top(path):
              try:
                  with path.open(encoding="utf-8-sig") as f:
                      return max(0, sum(1 for _ in csv.reader(f)) - 1)
              except Exception:
                  return None


          def main():
              data = Path(sys.argv[1]) if len(sys.argv) > 1 else Path("данные")
              out = Path(sys.argv[2]) if len(sys.argv) > 2 else Path("report.md")
              failed_file = Path("провалы.txt")
              failed = [x.strip() for x in failed_file.read_text(encoding="utf-8").splitlines() if x.strip()] \
                  if failed_file.exists() else []
              now = datetime.now(ASTANA)
              today = now.date()

              rows, stale = [], []
              for sp in sorted(data.glob("sale_*.json")):
                  key = sp.name[len("sale_"):-len(".json")]
                  mtime = datetime.fromtimestamp(sp.stat().st_mtime, ASTANA).date()
                  n_sale = count_sale(sp)
                  n_top = count_top(data / f"top_{key}.csv")
                  if mtime != today:
                      stale.append(key)
                  rows.append((key, n_sale, n_top, mtime))

              lines = [f"# Отчёт сбора — {now:%d.%m.%Y %H:%M} (Астана)", ""]
              lines.append("## Что не собралось")
              lines += [f"- {x}" for x in failed] or ["- Ничего: все сборщики отработали без ошибок."]
              lines += ["", "## Файлы, которые не обновились сегодня"]
              lines += [f"- {x}" for x in stale] or ["- Нет: все файлы свежие."]
              lines += ["", "## Что собрано", "", "| Магазин | Товаров в Sale | В топе | Дата файла |", "|---|---|---|---|"]
              for key, n_sale, n_top, mt in rows:
                  lines.append(f"| {key} | {'—' if n_sale is None else n_sale} | {'—' if n_top is None else n_top} | {mt:%d.%m} |")
              lines += ["", f"Всего магазинов с файлом: {len(rows)}. Сбор отчёта: {now:%H:%M} по Астане."]
              out.write_text("\n".join(lines) + "\n", encoding="utf-8")
              print(f"Отчёт: {out} ({len(rows)} магазинов, сбоев: {len(failed)}, устаревших: {len(stale)})")


          if __name__ == "__main__":
              main()
          PYEOF_9
          python универсальный.py || { echo "ВНИМАНИЕ: часть сайтов собралась не полностью, см. строки выше"; echo "Универсальный (Shopify и Shop Simon)" >> провалы.txt; }
          python salesforce.py || { echo "ВНИМАНИЕ: часть сайтов Salesforce собралась не полностью"; echo "Salesforce (Skechers, Tory Burch, Saucony, Gymshark, Snipes DE)" >> провалы.txt; }
          python zappos.py || { echo "ВНИМАНИЕ: Zappos/6pm собрались не полностью"; echo "Zappos и 6pm" >> провалы.txt; }
          python puma.py || { echo "ВНИМАНИЕ: PUMA собрался не полностью"; echo "PUMA" >> провалы.txt; }
          python victorias.py || { echo "ВНИМАНИЕ: Victoria's Secret собрался не полностью"; echo "Victoria's Secret" >> провалы.txt; }
          python outnet.py || { echo "ВНИМАНИЕ: THE OUTNET собрался не полностью"; echo "THE OUTNET" >> провалы.txt; }
          python3 отчёт_сбора.py данные report.md || true
          cp report.md "$GITHUB_WORKSPACE/report.md" || true
          cp данные/sale_*.json данные/top_*.csv "$GITHUB_WORKSPACE/" || true
      - name: Положить в репозиторий
        run: |
          git config user.name "kurs-bot"
          git config user.email "kurs-bot@users.noreply.github.com"
          git add sale_*.json top_*.csv report.md
          git commit -m "shopify $(date -u +%F)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
